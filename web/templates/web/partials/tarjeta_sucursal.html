<article class="tarjeta-sucursal">
    <div class="tarjeta-sucursal__media">
        {% if sucursal.imagen %}
            <img src="{{ sucursal.imagen.url }}" alt="Fachada de {{ sucursal.nombre }}" loading="lazy">
        {% else %}
            <div class="media-vacia">{{ sucursal.nombre|first }}</div>
        {% endif %}
    </div>
    <div class="tarjeta-sucursal__cuerpo">
        <span class="tarjeta-sucursal__ciudad">{{ sucursal.ciudad }}</span>
        <h3>{{ sucursal.nombre }}</h3>
        <div class="dato">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/>
            </svg>
            {{ sucursal.direccion }}
        </div>
        <div class="dato">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>
            </svg>
            {{ sucursal.telefono }}
        </div>
        <div class="dato">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
            </svg>
            {{ sucursal.horario }}
        </div>
        {% if sucursal.mapa_url %}
            <a class="tarjeta-sucursal__enlace" href="{{ sucursal.mapa_url }}" target="_blank" rel="noopener">Ver ubicación →</a>
        {% endif %}
    </div>
</article>
